syntax = "proto3";

package vanguard;

message Envelope {
  uint32 message_type   = 1;
  bytes  payload        = 2;
  bytes  signature      = 3;
  uint32 version        = 4;
  uint32 sequence_number = 5;
}

message AuthenticationRequest {
  string      machine_id           = 1;
  bytes       sub_message_2        = 2;
  uint32      machine_token        = 3;
  string      client_rsa_public_key = 4;
  string      game_id              = 5;
  bytes       sub_message_6        = 6;
  bytes       sub_message_7        = 7;
  string      game_id_alt          = 8;
  uint32      field_9              = 9;
  repeated string unknown_10       = 10;
  AppInfo     app_info             = 11;
  DeviceInfo  device_info          = 12;
  string      session_id           = 13;
}

message AccessRequest {
  string auth_token = 1;
}

message TokenResponse {
  string token       = 1;
  int64  exp         = 2;
  string session_id  = 3;

  repeated ConfigEntry config = 4;

  message ConfigEntry {
    string key   = 1;
    string value = 2;
  }
}

message HeartbeatRequest {
  string          access_token  = 1;
  int32           timestamp     = 2;
  repeated string active_tasks  = 3;
  int32           status        = 4;
  repeated string metrics       = 5;
  bool            ready         = 6;
}

message HeartbeatResponse {
  int32           timestamp         = 1;
  bool            should_disconnect = 3;
  repeated string active_tasks      = 4;
}

message DisconnectRequest {
  string access_token = 1;
  int32  reason       = 2;
}

message TaskResultRequest {
  string              access_token = 1;
  repeated TaskResult results      = 2;
}

message TaskResult {
  string          id              = 1;
  bytes           data            = 2;
  ModuleResult    module_result   = 3;
  int32           start_time      = 4;
  int32           end_time        = 5;
  TaskPerformance performance     = 6;
}

message Task {
  string id = 1;
}

message TaskResponse {}

message TaskPerformance {}

message ModulesResponse {
  repeated Module modules = 1;
}

message Module {
  string          id        = 1;
  string          cdn_url   = 2;
  repeated string arguments = 3;
}

message ModuleResult {
  string commit_sha = 1;
}

message ModuleCDNData {}

message ModuleTaskData {}

message AppInfo {
  int32  id           = 1;
  string version_name = 2;
}

message DeviceInfo {
  OSInfo              os_info    = 1;
  MemoryInfo          memory     = 2;
  repeated CpuInfo    cpu_cores  = 3;
  map<string, string> info_entries = 10;
}

message OSInfo {
  int32  type    = 1;
  int32  build   = 2;
  string variant = 3;
  string version = 4;
}

message CpuInfo {
  string           brand = 1;
  string           model = 2;
  repeated CoreInfo cores = 4;
}

message CoreInfo {}

message GpuInfo {
  string     brand  = 1;
  string     model  = 2;
  MemoryInfo memory = 3;
}

message MemoryInfo {}

message Version {}
